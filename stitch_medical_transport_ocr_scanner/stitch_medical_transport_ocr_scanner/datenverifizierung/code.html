<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-variant flex-shrink-0">
<img alt="Driver Profile Portrait" class="w-full h-full object-cover" data-alt="A professional headshot of a mature male medical transport driver wearing a clean, dark blue uniform shirt. The lighting is bright and even, suggesting a clinical or daylight setting. The background is a soft, out-of-focus light gray. The mood is trustworthy and authoritative, matching the corporate/modern Krankentransport style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrmnCM-hGqBk4YXvyKexHe0R6t9bexkk8NjigI2SKF_BW4C4XEnomyLLS-Vb2XTZhzjagO3HMG2tOqrc0yiu-KlF1osGvHOz9XG4tAYRjmLp0B8lx8n5h82O2GEO1kYcbvLHJJwnnC-RbXbmhhWfUVruJ6zxnx0VA5yciyGLyfd_altIFicxCtc6vWkKypp1NVR-z5aBYfFQ8X3TQwGCtz2I8biRaw0Fut53-B2CZNcUZElsm7kIk_NuwQjpVOCkMh8anVtGKlypQ"/>
</div>
<h1 class="font-title-lg text-title-lg-mobile md:text-title-lg text-primary font-bold">Krankentransport</h1>
</div>
<button aria-label="Settings" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start p-margin-mobile md:p-lg pb-32">
<div class="w-full max-w-lg flex flex-col gap-lg">
<!-- Page Header -->
<div class="flex flex-col gap-xs pt-sm">
<h2 class="font-headline-md text-headline-md text-on-background">Daten überprüfen</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Bitte korrigieren Sie fehlerhaft erkannte Daten.</p>
</div>
<!-- Verification Form Container -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md md:p-lg shadow-sm flex flex-col gap-lg">
<!-- Abholort Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="abholort">Abholort</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">location_on</span>
<input class="w-full min-h-[56px] pl-[48px] pr-sm py-sm bg-surface rounded border border-outline-variant text-on-background font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="abholort" type="text" value="Mühlenstraße 56, 46284 Dorsten"/>
</div>
</div>
<!-- Zielort Field (Needs Check) -->
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface" for="zielort">Zielort</label>
<span class="flex items-center gap-xs text-error font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] filled" style="font-variation-settings: 'FILL' 1;">warning</span>
                            Prüfung erforderlich
                        </span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-error">flag</span>
<input class="w-full min-h-[56px] pl-[48px] pr-[48px] py-sm bg-error-container/10 rounded border-2 border-error text-on-background font-body-md focus:outline-none focus:ring-2 focus:ring-error/50 transition-colors" id="zielort" type="text" value="Kinderklinik Datteln - Neuropädiatrie"/>
<button aria-label="Clear Zielort" class="absolute right-sm text-error hover:bg-error-container p-1 rounded-full transition-colors flex items-center justify-center h-8 w-8">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Fahrtart Selection -->
<div class="flex flex-col gap-sm pt-sm border-t border-outline-variant">
<span class="font-label-lg text-label-lg text-on-surface">Fahrtart</span>
<div class="flex flex-col gap-sm">
<!-- Option 1 -->
<label class="flex items-center gap-md p-sm border border-outline-variant rounded hover:bg-surface-container-low cursor-pointer min-h-[56px] transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary cursor-pointer" name="fahrtart" type="radio" value="hinfahrt"/>
<span class="font-body-md text-body-md text-on-surface">Hinfahrt</span>
</label>
<!-- Option 2 -->
<label class="flex items-center gap-md p-sm border border-outline-variant rounded hover:bg-surface-container-low cursor-pointer min-h-[56px] transition-colors">
<input class="w-5 h-5 text-primary border-outline focus:ring-primary cursor-pointer" name="fahrtart" type="radio" value="rueckfahrt"/>
<span class="font-body-md text-body-md text-on-surface">Rückfahrt</span>
</label>
<!-- Option 3 (Selected) -->
<label class="flex items-center gap-md p-sm border-2 border-primary bg-primary-container/5 rounded cursor-pointer min-h-[56px] transition-colors">
<input checked="" class="w-5 h-5 text-primary border-outline focus:ring-primary cursor-pointer" name="fahrtart" type="radio" value="hin_rueckfahrt"/>
<span class="font-body-md text-body-md text-on-surface font-medium">Hin- &amp; Rückfahrt</span>
</label>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="pt-md w-full">
<button class="w-full bg-primary-container text-on-primary min-h-[56px] rounded-lg font-label-lg text-label-lg flex items-center justify-center shadow-sm hover:shadow-md hover:bg-primary transition-all active:scale-[0.98]">
                    Daten bestätigen
                </button>
</div>
</div>
</main>
